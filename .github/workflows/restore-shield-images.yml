name: Restore clean Shield product images

on:
  push:
    branches: [main]
    paths:
      - "scripts/restore_shield_images.py"
      - ".github/workflows/restore-shield-images.yml"

permissions:
  contents: write

jobs:
  restore-product-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image tools
        run: python -m pip install pillow numpy opencv-python-headless requests
      - name: Download official product photos and remove white backgrounds
        run: python scripts/restore_shield_images.py
      - name: Commit restored transparent PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/clean-products/*.png
          if git diff --cached --quiet; then
            echo "No image changes to commit."
            exit 0
          fi
          git commit -m "Restore clean transparent Shield product photos"
          git push origin main
