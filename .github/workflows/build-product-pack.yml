name: Build CleanEdge Product Image Pack

on:
  push:
    paths:
      - ".github/workflows/build-product-pack.yml"
  workflow_dispatch:

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Download current product images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cleanedge-product-images
          urls=(
            shield-shampoo-conditioner-1l
            shield-snow-foam-1l
            shield-xtreme-shampoo-500ml
            shield-jetwasher-1l
            shield-tyre-shine-500ml
            shield-tyre-gloss-aerosol-400ml
            shield-tyre-polish-paste-400ml
            shield-max-shine-tyre-gel-500ml
            shield-mag-cleaner-500ml
            shield-miraplate-500ml
            shield-power-force-degreaser-1l
            shield-waterless-glass-cleaner-1l
            shield-high-foam-shampoo-5l
            shield-splash-wash-wax-1l
            shield-sheen-silicone-500ml
            shield-car-polish-paste-200ml
            shield-blade-apc-750ml
            shield-engine-cleaner-500ml
            shield-splash-n-dash-sponge
            shield-foam-applicator-pads-3
          )
          for id in "${urls[@]}"; do
            curl -fL --retry 3 --retry-delay 2 "https://cleanedgefinal-xbdw.vercel.app/images/clean-products/${id}.png" -o "cleanedge-product-images/${id}.png"
          done
          ls -lh cleanedge-product-images
      - name: Create ZIP
        run: |
          zip -j -9 cleanedge-product-images.zip cleanedge-product-images/*.png
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: cleanedge-product-images
          path: cleanedge-product-images.zip
          retention-days: 7
