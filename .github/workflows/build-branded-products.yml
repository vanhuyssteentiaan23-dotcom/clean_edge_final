name: Build branded product PNGs

on:
  push:
    branches: [main]
    paths:
      - "public/images/clean-products/**"
      - ".github/workflows/build-branded-products.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-branded-products:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install image renderer
        run: python3 -m pip install --quiet pillow

      - name: Create baked product images
        run: |
          python3 <<'PY'
          from PIL import Image, ImageDraw, ImageFont, ImageFilter
          from pathlib import Path

          ids = [
            "shield-shampoo-conditioner-1l",
            "shield-snow-foam-1l",
            "shield-xtreme-shampoo-500ml",
            "shield-jetwasher-1l",
            "shield-tyre-shine-500ml",
            "shield-tyre-gloss-aerosol-400ml",
            "shield-tyre-polish-paste-400ml",
            "shield-max-shine-tyre-gel-500ml",
            "shield-mag-cleaner-500ml",
            "shield-miraplate-500ml",
            "shield-power-force-degreaser-1l",
            "shield-waterless-glass-cleaner-1l",
            "shield-high-foam-shampoo-5l",
            "shield-splash-wash-wax-1l",
            "shield-sheen-silicone-500ml",
            "shield-car-polish-paste-200ml",
            "shield-blade-apc-750ml",
            "shield-engine-cleaner-500ml",
            "shield-splash-n-dash-sponge",
            "shield-foam-applicator-pads-3"
          ]

          root = Path("public/images/clean-products")
          out = root / "branded"
          out.mkdir(parents=True, exist_ok=True)

          bold = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          regular = "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"

          for product_id in ids:
              base = Image.open(root / f"{product_id}.png").convert("RGBA")
              w, h = base.size

              scale = min(w, h) / 1024
              x0, y0 = int(337*scale), int(296*scale)
              x1, y1 = int(687*scale), int(502*scale)
              radius = max(10, int(12*scale))

              shadow = Image.new("RGBA", base.size, (0, 0, 0, 0))
              sd = ImageDraw.Draw(shadow)
              sd.rounded_rectangle((x0+7*scale, y0+9*scale, x1+7*scale, y1+9*scale),
                                   radius=radius, fill=(0,0,0,185))
              shadow = shadow.filter(ImageFilter.GaussianBlur(max(2, int(7*scale))))
              base = Image.alpha_composite(base, shadow)

              label = Image.new("RGBA", base.size, (0,0,0,0))
              d = ImageDraw.Draw(label)
              d.rounded_rectangle((x0, y0, x1, y1), radius=radius,
                                  fill=(8,8,8,245), outline=(255,74,31,255),
                                  width=max(4, int(7*scale)))

              # subtle lower panel and orange accent lines
              d.polygon([(int(315*scale),int(455*scale)),
                         (int(710*scale),int(395*scale)),
                         (int(710*scale),int(520*scale)),
                         (int(315*scale),int(520*scale))], fill=(17,17,17,140))
              d.line((int(360*scale),int(461*scale),int(664*scale),int(461*scale)),
                     fill=(255,74,31,255), width=max(3,int(5*scale)))
              d.line((int(360*scale),int(472*scale),int(664*scale),int(472*scale)),
                     fill=(255,74,31,90), width=max(1,int(2*scale)))

              f_small = ImageFont.truetype(regular, max(10,int(13*scale)))
              f_clean = ImageFont.truetype(bold, max(20,int(30*scale)))
              f_edge = ImageFont.truetype(bold, max(26,int(42*scale)))

              def centered(text, y, font, fill, spacing=0):
                  bbox = d.textbbox((0,0), text, font=font)
                  tw = bbox[2] - bbox[0]
                  d.text(((w-tw)//2, int(y*scale)), text, font=font, fill=fill, stroke_width=0)

              centered("PRO DETAILING", 312, f_small, (170,164,156,255))
              centered("CLEAN", 365, f_clean, (247,242,233,255))
              centered("EDGE", 404, f_edge, (255,74,31,255))
              d.ellipse((int(356*scale),int(339*scale),int(366*scale),int(349*scale)), fill=(255,74,31,255))
              d.ellipse((int(658*scale),int(339*scale),int(668*scale),int(349*scale)), fill=(255,74,31,255))

              base = Image.alpha_composite(base, label)
              base.save(out / f"{product_id}.png", "PNG", optimize=True)

          print("Created", len(ids), "baked product PNGs")
          PY

      - name: Commit baked images/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/clean-products/branded/*.png
          if git diff --cached --quiet; then
            echo "No branded image changes."
            exit 0
          fi
          git commit -m "Bake CleanEdge labels into product images"
          git push
