name: Build branded product PNGs

on:
  push:
    branches: [main]
    paths:
      - "public/images/clean-products/**"
      - ".github/workflows/build-branded-products.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-branded-products:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install image renderer
        run: npm install --no-save sharp

      - name: Create baked product images
        run: |
          node <<'NODE'
          const sharp = require("sharp");
          const fs = require("fs");
          const path = require("path");

          const ids = [
            "shield-shampoo-conditioner-1l",
            "shield-snow-foam-1l",
            "shield-xtreme-shampoo-500ml",
            "shield-jetwasher-1l",
            "shield-tyre-shine-500ml",
            "shield-tyre-gloss-aerosol-400ml",
            "shield-tyre-polish-paste-400ml",
            "shield-max-shine-tyre-gel-500ml",
            "shield-mag-cleaner-500ml",
            "shield-miraplate-500ml",
            "shield-power-force-degreaser-1l",
            "shield-waterless-glass-cleaner-1l",
            "shield-high-foam-shampoo-5l",
            "shield-splash-wash-wax-1l",
            "shield-sheen-silicone-500ml",
            "shield-car-polish-paste-200ml",
            "shield-blade-apc-750ml",
            "shield-engine-cleaner-500ml",
            "shield-splash-n-dash-sponge",
            "shield-foam-applicator-pads-3"
          ];

          const W = 1080;
          const S = W / 1024;
          const overlay = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${W}" viewBox="0 0 1024 1024">
            <defs>
              <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
                <feDropShadow dx="7" dy="9" stdDeviation="7" flood-color="#000" flood-opacity=".72"/>
              </filter>
              <linearGradient id="label" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#1d1d1d"/>
                <stop offset=".55" stop-color="#0b0b0b"/>
                <stop offset="1" stop-color="#050505"/>
              </linearGradient>
              <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#ff5a2b"/>
                <stop offset="1" stop-color="#ef3d17"/>
              </linearGradient>
              <clipPath id="labelClip">
                <path d="M337 302 Q345 296 357 296 H667 Q679 296 687 305 L682 488 Q681 500 668 502 H354 Q341 500 339 488 Z"/>
              </clipPath>
            </defs>
            <g transform="scale(${S})" filter="url(#shadow)">
              <path d="M337 302 Q345 296 357 296 H667 Q679 296 687 305 L682 488 Q681 500 668 502 H354 Q341 500 339 488 Z" fill="url(#label)" stroke="url(#orange)" stroke-width="7"/>
              <g clip-path="url(#labelClip)">
                <path d="M315 455 L710 395 L710 520 L315 520 Z" fill="#111" opacity=".55"/>
                <path d="M360 461 H664" stroke="#ff4a1f" stroke-width="5"/>
                <path d="M360 472 H664" stroke="#ff4a1f" stroke-width="2" opacity=".35"/>
              </g>
              <text x="512" y="329" text-anchor="middle" fill="#aaa49c" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" letter-spacing="4">PRO DETAILING</text>
              <text x="512" y="385" text-anchor="middle" fill="#f7f2e9" font-family="Arial Black,Arial,sans-serif" font-size="30" font-weight="900" letter-spacing="2">CLEAN</text>
              <text x="512" y="425" text-anchor="middle" fill="#ff4a1f" font-family="Arial Black,Arial,sans-serif" font-size="42" font-weight="900" letter-spacing="1">EDGE</text>
              <circle cx="361" cy="344" r="5" fill="#ff4a1f"/>
              <circle cx="663" cy="344" r="5" fill="#ff4a1f"/>
            </g>
          </svg>`;

          (async () => {
            const outDir = "public/images/clean-products/branded";
            fs.mkdirSync(outDir, { recursive: true });
            for (const id of ids) {
              await sharp(`public/images/clean-products/${id}.png`)
                .composite([{ input: Buffer.from(overlay), blend: "over" }])
                .png()
                .toFile(path.join(outDir, `${id}.png`));
            }
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Commit baked images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/clean-products/branded/*.png
          if git diff --cached --quiet; then
            echo "No branded image changes."
            exit 0
          fi
          git commit -m "Bake CleanEdge labels into product images"
          git push
