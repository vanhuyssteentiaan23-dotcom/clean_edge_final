name: Build branded product PNGs

on:
  push:
    branches: [main]
    paths:
      - "public/images/clean-products/**"
      - ".github/workflows/build-branded-products.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-branded-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified baked images
        run: |
          set -e
          mkdir -p public/images/clean-products/branded
          ids=(
            shield-shampoo-conditioner-1l
            shield-snow-foam-1l
            shield-xtreme-shampoo-500ml
            shield-jetwasher-1l
            shield-tyre-shine-500ml
            shield-tyre-gloss-aerosol-400ml
            shield-tyre-polish-paste-400ml
            shield-max-shine-tyre-gel-500ml
            shield-mag-cleaner-500ml
            shield-miraplate-500ml
            shield-power-force-degreaser-1l
            shield-waterless-glass-cleaner-1l
            shield-high-foam-shampoo-5l
            shield-splash-wash-wax-1l
            shield-sheen-silicone-500ml
            shield-car-polish-paste-200ml
            shield-blade-apc-750ml
            shield-engine-cleaner-500ml
            shield-splash-n-dash-sponge
            shield-foam-applicator-pads-3
          )
          base="https://sb-6af5f4zuq23t.vercel.run/branded-png"
          for id in "${ids[@]}"; do
            curl --fail --silent --show-error --location "${base}/${id}.png" -o "public/images/clean-products/branded/${id}.png"
            file "public/images/clean-products/branded/${id}.png"
          done

      - name: Commit baked images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/clean-products/branded/*.png
          if git diff --cached --quiet; then
            echo "No branded image changes."
            exit 0
          fi
          git commit -m "Replace product images with baked CleanEdge PNGs"
          git push
